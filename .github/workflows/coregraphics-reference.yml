name: Core Graphics sampling reference

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Capture native bitmap sampling
        run: swift scripts/capture-coregraphics-reference.swift > coregraphics-reference.json
      - name: Validate native stroke coverage controls
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, math
          from pathlib import Path
          cases = json.loads(Path('coregraphics-reference.json').read_text())['strokeCoverage']
          assert len(cases) == len({c['name'] for c in cases}) == 67
          assert sum(c['transformName'] == 'identity' and c['cap'] == 'butt' for c in cases) == 49
          assert sum(c['transformName'] == 'translated' for c in cases) == 6
          assert sum(c['transformName'] == 'affine' for c in cases) == 6
          assert sum(c['cap'] == 'round' for c in cases) == 3
          assert sum(c['cap'] == 'square' for c in cases) == 3
          for case in cases:
              assert case['width'] > 0
              assert len(case['start']) == len(case['end']) == 2 and len(case['transform']) == 6
              assert len(case['rgba']) == 4 and all(0 <= v <= 1 for v in case['rgba'])
              assert all(math.isfinite(v) for key in ['start', 'end', 'transform', 'rgba'] for v in case[key])
              assert math.isfinite(case['degrees']) and math.isfinite(case['phase'])
              item = case['output']
              assert (item['width'], item['height'], item['rowBytes'], item['bitsPerComponent']) == (96, 72, 384, 8)
              raw = base64.b64decode(item['rgbaBase64'], validate=True)
              assert len(raw) == 384 * 72 and hashlib.sha256(raw).hexdigest() == item['sha256']
              assert any(raw[3::4]), 'Native stroke draw is empty'
              assert all(raw[i + channel] <= raw[i + 3] for i in range(0, len(raw), 4) for channel in range(3))
          print('Validated 67 native stroke coverage recipes and bitmap buffers')
          PY
      - name: Validate paired Hue and Saturation controls
        run: |
          python3 - <<'PY'
          import base64, hashlib, json
          from pathlib import Path
          reference = json.loads(Path('coregraphics-reference.json').read_text())
          assert reference['schema'] == 1 and reference['platform'] == 'macOS'
          pairs = reference['nonseparablePairs']
          assert len(pairs['labels']) == len(set(pairs['labels'])) == 8
          assert len(pairs['cases']) == 6
          assert {(c['mode'], c['opacity']) for c in pairs['cases']} == {
              (mode, opacity) for mode in ['hue', 'saturation'] for opacity in [1, 0.5, 0.25]}
          buffers = [pairs['source']] + [case[key] for case in pairs['cases'] for key in ['input', 'output']]
          for item in buffers:
              assert (item['width'], item['height'], item['rowBytes'], item['bitsPerComponent']) == (8, 1, 32, 8)
              raw = base64.b64decode(item['rgbaBase64'], validate=True)
              assert len(raw) == 32 and hashlib.sha256(raw).hexdigest() == item['sha256']
              assert all(raw[i + channel] <= raw[i + 3] for i in range(0, 32, 4) for channel in range(3))
          print('Validated eight source/backdrop pairs, six recipes and thirteen buffers')
          PY
      - name: Validate native text geometry and baseline controls
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, math
          from pathlib import Path
          reference = json.loads(Path('coregraphics-reference.json').read_text())
          geometry = reference['textGeometry']
          expected = {(face, size) for face in ['Inter-Regular', 'Inter-Bold', 'Inter-Light']
                      for size in [12, 24, 36, 12.5, 24.5, 36.5]}
          assert len(geometry) == 18 and {(c['face'], c['size']) for c in geometry} == expected
          assert all(c['matchesBundledFont'] and c['bundledSha256'] == c['resolvedSha256'] for c in reference['text'])
          buffers = 0
          for case in geometry:
              assert len(case['glyphs']) == 4
              assert [g['characterIndex'] for g in case['glyphs']] == [0, 1, 2, 3]
              for glyph in case['glyphs']:
                  assert 0 <= glyph['glyph'] <= 65535
                  assert all(math.isfinite(v) for key in ['location', 'advance', 'bounds', 'lineFragment'] for v in glyph[key])
              assert all(math.isfinite(v) for v in case['usedRect'])
              assert case['lineHeight'] > 0 and all(math.isfinite(v) for v in case['coreTextMetrics'].values())
              runs = case['coreTextRuns']
              assert sum(len(run['glyphs']) for run in runs) == 4
              for run in runs:
                  assert len(run['glyphs']) == len(run['positions']) == len(run['advances'])
                  assert all(math.isfinite(v) for key in ['positions', 'advances'] for point in run[key] for v in point)
              draws = case['draws']
              assert len(draws) == 8
              assert {(d['engine'], d['smoothing'], d.get('baselinePolicy')) for d in draws} == {
                  (engine, smoothing, policy) for smoothing in [True, False]
                  for engine, policies in [('NSLayoutManager', [None]),
                                           ('CTLine', ['rounded-ascent', 'fractional-ascent', 'descent'])]
                  for policy in policies}
              for draw in draws:
                  if draw['engine'] == 'CTLine':
                      assert math.isfinite(draw['baselineOffset'])
                  item = draw['output']
                  assert (item['width'], item['height'], item['rowBytes'], item['bitsPerComponent']) == (96, 144, 384, 8)
                  raw = base64.b64decode(item['rgbaBase64'], validate=True)
                  assert len(raw) == 384 * 144 and hashlib.sha256(raw).hexdigest() == item['sha256']
                  assert any(raw[3::4]), 'Native text draw is empty'
                  assert all(raw[i + channel] <= raw[i + 3] for i in range(0, len(raw), 4) for channel in range(3))
                  buffers += 1
          assert buffers == 144
          print('Validated eighteen text layouts, seventy-two glyph records and 144 native baseline buffers')
          PY
      - name: Validate native paragraph geometry
        run: |
          python3 - <<'PY'
          import json, math
          from pathlib import Path
          reference = json.loads(Path('coregraphics-reference.json').read_text())
          cases = reference['textParagraphGeometry']
          base = {'tight-leading', 'loose-leading', 'wrapped', 'tracking',
              'centered', 'right-aligned', 'multiline', 'combining', 'ligature', 'surrogate', 'bidi-controls',
              'bidi-left-override', 'bidi-right-embedding', 'bidi-left-embedding', 'bidi-right-isolate',
              'bidi-left-isolate', 'bidi-unmatched', 'bidi-nested', 'bidi-tracking', 'bidi-size24',
              'bidi-only', 'bidi-initial', 'bidi-adjacent', 'bidi-first-strong',
              'bidi-back-to-back', 'bidi-empty', 'bidi-wrapped'}
          tracked = {name + '-tracking' for name in base if name.startswith('bidi-')
                     and name not in {'bidi-controls', 'bidi-tracking'}}
          negative = {'bidi-negative-tracking', 'bidi-nested-negative-tracking', 'bidi-initial-negative-tracking'}
          assert len(cases) == 45 and {c['name'] for c in cases} == base | tracked | negative
          for case in cases:
              assert case['face'] == 'Inter-Regular'
              assert 0 <= case['controlGlyph'] <= 0xFFFFFFFF
              assert len(case['text'].encode('utf-16-le')) // 2 == case['utf16Length']
              assert case['glyphs'] and all(math.isfinite(case[k]) for k in ['size', 'lineHeight', 'tracking', 'width'])
              for glyph in case['glyphs']:
                  assert 0 <= glyph['glyph'] <= 0xFFFFFFFF and 0 <= glyph['characterIndex'] < case['utf16Length']
                  assert len(glyph['location']) == 2 and len(glyph['lineFragment']) == 4
                  assert all(math.isfinite(v) for key in ['location', 'lineFragment'] for v in glyph[key])
                  start, count = glyph['effectiveRange']
                  assert 0 <= start < len(case['glyphs']) and 0 < count <= len(case['glyphs']) - start
          fallback = reference['textFallbackFonts']
          assert len(fallback) == 3 and {c['name'] for c in fallback} == {'plain', 'surrogate', 'bidi-controls'}
          for case in fallback:
              assert case['primary']['name'] == 'Inter-Regular' and case['runs']
              length = len(case['text'].encode('utf-16-le')) // 2
              for run in case['runs']:
                  start, count = run['range']
                  assert 0 <= start < length and 0 < count <= length - start
                  assert run['font']['name'] and run['font']['file']
                  assert all(math.isfinite(run['font'][k]) for k in ['size', 'ascent', 'descent', 'leading'])
                  assert len(run['glyphs']) == len(run['advances'])
                  assert all(0 <= glyph <= 65535 for glyph in run['glyphs'])
                  assert all(math.isfinite(v) for advance in run['advances'] for v in advance)
          print('Validated 45 native paragraph layouts and three fallback font controls')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: coregraphics-reference
          path: coregraphics-reference.json
          if-no-files-found: error
