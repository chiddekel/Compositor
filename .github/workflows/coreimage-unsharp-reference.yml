name: Native unsharp and Gaussian precision reference

on:
  workflow_dispatch:
  push:
    branches: ['verify/macos-unsharp-*']
    paths:
      - 'scripts/capture-coreimage-unsharp.swift'
      - 'scripts/validate-coreimage-unsharp-reference.py'
      - 'tests/test_coreimage_unsharp_reference.py'
      - 'scripts/capture-metal-sampling.swift'
      - 'scripts/validate-metal-sampling-reference.py'
      - 'tests/test_metal_sampling_reference.py'
      - 'scripts/capture-dispersion-sampling.swift'
      - 'scripts/validate-dispersion-sampling-reference.py'
      - 'tests/test_dispersion_sampling_reference.py'
      - 'scripts/capture-native-cube.py'
      - 'tests/test_native_cube_reference.py'
      - 'scripts/capture-native-png.swift'
      - 'scripts/validate-native-png.py'
      - 'tests/test_native_png_reference.py'
      - 'scripts/validate-native-gpu-traces.py'
      - 'scripts/finalize-native-gpu-traces.py'
      - 'tests/test_native_gpu_traces.py'
      - '.github/workflows/coreimage-unsharp-reference.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Test capture validation and rejection controls
        run: |
          python3 tests/test_coreimage_unsharp_reference.py
          python3 tests/test_metal_sampling_reference.py
          python3 tests/test_dispersion_sampling_reference.py
          python3 tests/test_native_cube_reference.py
          python3 tests/test_native_png_reference.py
          python3 tests/test_native_gpu_traces.py
      - name: Capture independent native precision controls
        run: swift scripts/capture-coreimage-unsharp.swift > coreimage-unsharp-reference.json
      - name: Validate complete native matrix and bitmap hashes
        run: python3 scripts/validate-coreimage-unsharp-reference.py coreimage-unsharp-reference.json
      - name: Capture direct Metal texture sampling
        run: swift scripts/capture-metal-sampling.swift coreimage-unsharp-reference.json > metal-sampling-reference.json
      - name: Validate direct Metal texture matrix and source storage
        run: python3 scripts/validate-metal-sampling-reference.py metal-sampling-reference.json coreimage-unsharp-reference.json
      - name: Capture unchanged RGB Split with native texture formats
        run: swift scripts/capture-dispersion-sampling.swift > dispersion-sampling-reference.json
      - name: Validate complete RGB Split matrix and native buffers
        run: python3 scripts/validate-dispersion-sampling-reference.py dispersion-sampling-reference.json
      - name: Capture native CPU color-cube arithmetic
        run: python3 scripts/capture-native-cube.py > native-cube-reference.json
      - name: Validate native CPU color-cube recipes and hashes
        run: python3 scripts/capture-native-cube.py --validate native-cube-reference.json
      - name: Capture native PNG unpremultiplication
        run: swift scripts/capture-native-png.swift native-png-reference.png > native-png-reference.json
      - name: Validate native PNG pixels and provenance
        run: python3 scripts/validate-native-png.py native-png-reference.json native-png-reference.png
      - name: Capture native Gaussian GPU execution
        env:
          MTL_CAPTURE_ENABLED: '1'
        run: swift scripts/capture-coreimage-unsharp.swift --gpu-traces gpu-traces > gpu-trace-report.json
      - name: Validate GPU trace inventory and native output identity
        run: |
          python3 scripts/finalize-native-gpu-traces.py gpu-trace-report.json gpu-traces gpu-trace-inventory.json
          python3 scripts/validate-native-gpu-traces.py gpu-trace-report.json coreimage-unsharp-reference.json gpu-traces gpu-trace-inventory.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coreimage-unsharp-reference
          path: |
            coreimage-unsharp-reference.json
            metal-sampling-reference.json
            dispersion-sampling-reference.json
            native-cube-reference.json
            native-png-reference.json
            native-png-reference.png
            gpu-trace-report.json
            gpu-trace-inventory.json
            gpu-traces
          if-no-files-found: error
