name: Native Core Graphics byte blend reference

on:
  workflow_dispatch:
  push:
    branches: ['verify/macos-unsharp-*']
    paths:
      - 'scripts/capture-native-byte-blends.swift'
      - 'scripts/validate-native-byte-blends.py'
      - '.github/workflows/native-byte-blends-reference.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: macos-26-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Record native environment
        run: |
          sw_vers
          uname -m
          swift --version
      - name: Capture native byte blend buffers
        run: |
          mkdir native-byte-blends
          swift scripts/capture-native-byte-blends.swift native-byte-blends > native-byte-blends/report.json
      - name: Validate inputs and native controls
        run: python3 scripts/validate-native-byte-blends.py native-byte-blends/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-byte-blends-reference
          path: native-byte-blends/
          if-no-files-found: error
