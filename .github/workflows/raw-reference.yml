name: Native RAW tone reference

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate independent and canonical RAW controls
        run: |
          python3 -m pip install -r scripts/parity-requirements.txt
          python3 scripts/parity-inputs.py .build/raw-reference-inputs
          python3 scripts/raw-precision-input.py .build/raw-reference-inputs/precision-ramp.dng
      - name: Capture native boost and exposure controls
        run: |
          swift scripts/capture-raw-reference.swift .build/raw-reference-inputs/sensor-*.dng \
            .build/raw-reference-inputs/precision-ramp.dng > .build/raw-reference.json
          python3 scripts/validate-raw-reference.py .build/raw-reference.json .build/raw-reference-inputs
      - uses: actions/upload-artifact@v4
        with:
          name: raw-reference
          path: |
            .build/raw-reference.json
            .build/raw-reference-inputs/*.dng
          if-no-files-found: error
