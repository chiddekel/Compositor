name: Core Image filter graph diagnostics

on:
  workflow_dispatch:
    inputs:
      small_radii:
        description: JSON array of unique probe radii in 0...1 (empty selects default probes)
        type: string
        default: '[]'

permissions:
  contents: read

jobs:
  capture:
    runs-on: macos-26
    timeout-minutes: 10
    env:
      PROBE_RADII: ${{ inputs.small_radii || '[]' }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Capture native filter descriptions and bitmap hashes
        run: swift scripts/capture-coreimage-graph.swift --small-radii "$PROBE_RADII" > coreimage-graph-reference.json
      - name: Validate diagnostic recipes
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, math, os, re
          from pathlib import Path
          reference = json.loads(Path('coreimage-graph-reference.json').read_text())
          assert reference['schema'] == 1 and reference['platform'] == 'macOS'
          assert reference['diagnosticDescriptions'] is True
          assert reference['scriptSha256'] == hashlib.sha256(Path('scripts/capture-coreimage-graph.swift').read_bytes()).hexdigest()
          cases = reference['cases']
          assert len(reference['inputs']) == 2 and len(cases) == 164
          keys = {(c['fixture'], c['filter'], c['radius'], c.get('degrees')) for c in cases}
          expected = {(fixture, 'CIGaussianBlur', radius, None)
                      for fixture in ['opaque-gradient', 'impulse']
                      for radius in [0, 0.1, 0.5, 1 / math.sqrt(3), 1, 2, 5, 10, 17, 35]}
          expected |= {(fixture, 'CIMotionBlur', radius, degrees)
                       for fixture in ['opaque-gradient', 'impulse']
                       for radius in [0, 0.1, 0.5, 1 / math.sqrt(3), 1, 2, 10 / math.sqrt(12), 35 / math.sqrt(12)]
                       for degrees in [0, -35, 35, 37, 90, -90, 180, 360, 0.125]}
          assert len(keys) == 164 and keys == expected
          for case in cases:
              assert case['fixture'] in ['opaque-gradient', 'impulse']
              assert case['filter'] in ['CIGaussianBlur', 'CIMotionBlur']
              assert math.isfinite(case['radius']) and case['radius'] >= 0
              assert math.isfinite(case.get('degrees', 0))
          probes = reference['smallRadiusProbes']
          radii = json.loads(os.environ.get('PROBE_RADII', '[]'))
          assert isinstance(radii, list) and len(radii) <= 64
          assert all(type(r) in [int, float] and math.isfinite(r) and 0 <= r <= 1 for r in radii)
          assert len(set(radii)) == len(radii)
          if not radii:
              radii = [0, 0.1, 0.125, 1 / 6 - 0.000001, 1 / 6, 1 / 6 + 0.000001, 0.2, 0.25, 0.3, 0.4, 0.5]
          assert reference['probeRadii'] == radii
          expected_probes = {(fixture, radius, degrees)
                             for fixture in ['opaque-gradient', 'impulse']
                             for radius in radii
                             for degrees in [0, -35]}
          assert len(probes) == len(expected_probes)
          assert {(c['fixture'], c['radius'], c['degrees']) for c in probes} == expected_probes
          for probe in probes:
              output = probe['output']
              raw = base64.b64decode(output['rgbaBase64'], validate=True)
              assert len(raw) == 96 * 72 * 4 and hashlib.sha256(raw).hexdigest() == output['byteSha256']
          for case in reference['inputs'] + cases + probes:
              output = case['output']
              assert (output['width'], output['height']) == (96, 72)
              assert (output['byteBytes'], output['floatBytes']) == (96 * 72 * 4, 96 * 72 * 16)
              assert output['floatFinite'] is True
              assert all(re.fullmatch('[0-9a-f]{64}', output[key]) for key in ['byteSha256', 'floatSha256'])
              for key in ['descriptionBeforeRender', 'descriptionAfterRender']:
                  assert isinstance(output[key], str) and 0 < len(output[key]) <= 65536
              assert output['descriptionTruncated'] is False
          print(f'Validated 164 graph recipes, {len(probes)} small-radius probes and {166 + len(probes)} pairs of bitmap hashes')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coreimage-graph-reference
          path: coreimage-graph-reference.json
          if-no-files-found: error
