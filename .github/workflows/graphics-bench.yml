name: Graphics package E2E bench

on:
  pull_request:
    branches: [GNU_Linux]
  push:
    branches: [GNU_Linux]
  schedule:
    # Nightly soak + stress (UTC).
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      level:
        description: "small | medium | stress"
        default: small
      soak_iters:
        description: "Soak iterations (nightly default 10000)"
        default: "1000"

permissions:
  contents: read

concurrency:
  group: graphics-bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference-pr:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Python deps
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil
      - name: SMALL reference bench
        env:
          BENCH_MACHINE_CLASS: ci-linux-x86_64
          UI_BENCH_ARTIFACTS: ${{ github.workspace }}/build/graphics-bench-small
        run: |
          python3 -m tests.bench.runner run --level small --backend reference --workers 1 \
            --artifacts "$UI_BENCH_ARTIFACTS"
      - name: MEDIUM reference bench
        env:
          BENCH_MACHINE_CLASS: ci-linux-x86_64
          UI_BENCH_ARTIFACTS: ${{ github.workspace }}/build/graphics-bench-medium
        run: |
          python3 -m tests.bench.runner run --level medium --backend reference --workers 1 \
            --artifacts "$UI_BENCH_ARTIFACTS"
      - name: Compare SMALL against baseline
        env:
          BENCH_MACHINE_CLASS: ci-linux-x86_64
        run: |
          python3 -m tests.bench.report compare \
            tests/bench/baselines/ci-linux-x86_64.json \
            build/graphics-bench-small/report.json \
            --max-regression-percent 20
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphics-bench-pr
          path: build/graphics-bench-*
          if-no-files-found: warn
          retention-days: 14

  reference-nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install Python deps
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil
      - name: STRESS + concurrency sweep
        env:
          BENCH_MACHINE_CLASS: ci-linux-x86_64
        run: |
          for w in 1 2 4; do
            python3 -m tests.bench.runner run --level stress --backend reference --workers "$w" \
              --artifacts "${{ github.workspace }}/build/graphics-bench-stress-w$w"
          done
      - name: Memory pressure
        run: |
          python3 -m tests.bench.runner pressure \
            --artifacts "${{ github.workspace }}/build/graphics-bench-pressure"
      - name: Soak
        run: |
          iters="${{ github.event.inputs.soak_iters || '10000' }}"
          python3 -m tests.bench.runner soak --level medium --iters "$iters" \
            --artifacts "${{ github.workspace }}/build/graphics-bench-soak"
      - name: Upload nightly artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphics-bench-nightly
          path: build/graphics-bench-*
          if-no-files-found: warn
          retention-days: 21
