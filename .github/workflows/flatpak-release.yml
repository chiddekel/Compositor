name: Flatpak alpha release

on:
  push:
    tags: ['linux-v*']
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: flatpak-alpha-release
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'chiddekel/Compositor'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release source and version
        id: release
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          git fetch origin GNU_Linux
          git merge-base --is-ancestor HEAD origin/GNU_Linux
          tag=$(python3 -c 'import json; print("linux-v" + json.load(open("flatpak/release.json"))["version"])')
          if [ "$REF_TYPE" = tag ]; then test "$REF_NAME" = "$tag"; else test "$REF_NAME" = GNU_Linux; fi
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$tag^{commit}")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          python3 scripts/prepare-flatpak-release.py --output dist/site --tag "$tag"
      - name: Install Flatpak build tools and SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder dbus-x11 gnupg python3-yaml
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --user --install-deps-only --install-deps-from=flathub --assumeyes build/deps com.compositor.Client.yaml
      - name: Test the updater and release descriptors
        run: |
          bash scripts/test-flatpak-updates.sh
          python3 tests/test_flatpak_release.py
      - name: Cache dependency downloads
        uses: actions/cache@v4
        with:
          path: .flatpak-builder/downloads
          key: flatpak-downloads-${{ hashFiles('com.compositor.Client.yaml') }}
          restore-keys: flatpak-downloads-
      - name: Import release signing key
        env:
          FLATPAK_SIGNING_KEY: ${{ secrets.FLATPAK_SIGNING_KEY }}
        run: |
          test -n "$FLATPAK_SIGNING_KEY"
          signing_home=$(mktemp -d "$RUNNER_TEMP/compositor-signing.XXXXXX")
          chmod 700 "$signing_home"
          echo "GNUPGHOME=$signing_home" >> "$GITHUB_ENV"
          printf '%s' "$FLATPAK_SIGNING_KEY" | gpg --homedir "$signing_home" --batch --import
      - name: Build signed Flatpak and website
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: bash scripts/build-flatpak-release.sh "$RELEASE_TAG"
      - name: Verify installation from the signed repository
        run: |
          flatpak remote-add --user --gpg-import=flatpak/release-key.gpg compositor-release-test "$PWD/dist/site/repo"
          flatpak install --user --noninteractive -y compositor-release-test com.compositor.Client//alpha
          flatpak run --env=QT_QPA_PLATFORM=offscreen com.compositor.Client --session-smoke
      - name: Remove private signing material
        if: always()
        run: |
          if [ -n "${GNUPGHOME:-}" ]; then
            gpgconf --homedir "$GNUPGHOME" --kill all || true
            rm -rf -- "$GNUPGHOME"
          fi
      - name: Stage GitHub alpha release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease \
              --title "Compositor $RELEASE_TAG (Linux alpha)" --notes-file flatpak/RELEASE_NOTES.md
          fi
          gh release upload "$RELEASE_TAG" --clobber dist/com.compositor.Client.flatpak \
            dist/com.compositor.Client.flatpakref dist/compositor.flatpakrepo dist/release-key.gpg dist/SHA256SUMS
      - name: Upload Pages site and signed repository
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
      contents: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy download page and repository
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Publish the alpha release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false --prerelease
