# Minimal Flatpak manifest — Swift + Qt only (no Skia/OpenCV).
#
# A de-risking variant of com.wonderassembly.Compositor.yaml: it builds the
# Swift core (via the swift6 extension) and the Qt Widgets host shell against
# the KDE SDK's Qt6, with NO vendored Skia/OpenCV modules. Use this to prove the
# Swift toolchain works in-sandbox and the app launches, before tackling the
# harder Skia/OpenCV vendoring. The full manifest (com.wonderassembly.Compositor.yaml)
# is the real deliverable; this is a verification stepping stone.
#
# Build:
#   flatpak-builder --user --install --force-clean build-flatpak \
#     com.wonderassembly.Compositor.minimal.yaml
#   flatpak run com.wonderassembly.Compositor

app-id: com.wonderassembly.Compositor
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.swift6

command: compositor

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=home
  - --filesystem=xdg-download
  - --filesystem=/tmp

modules:
  - name: compositor
    buildsystem: simple
    build-options:
      # Mount the Swift toolchain (org.freedesktop.Sdk.Extension.swift6 mounts at
      # /usr/lib/sdk/swift6 in the KDE SDK sandbox). append-path makes `swift`
      # available to every build-command (each runs in its own shell, so a
      # one-line `export PATH` would not persist across commands).
      append-path: /usr/lib/sdk/swift6/bin
    build-commands:
      - swift build -c release --static-swift-stdlib
      - |
        cmake -S . -B build \
          -DCMAKE_PREFIX_PATH=/app \
          -DQt6_DIR=/usr/lib/x86_64-linux-gnu/cmake/Qt6 \
          -DCompositorCore_SWIFT_STATIC_LIB=$PWD/.build/release/libCompositorCore.a \
          -DCOMPOSITOR_REQUIRE_VENDORED_DEPS=OFF
      - cmake --build build
      - QT_QPA_PLATFORM=offscreen ctest --test-dir build --output-on-failure
      - install -Dm755 build/compositor /app/bin/compositor
      - |
        for s in 16 32 64 128 256 512; do
          install -Dm644 \
            Compositor/Assets.xcassets/AppIcon.appiconset/app-icon-${s}.png \
            /app/share/icons/hicolor/${s}x${s}/apps/com.wonderassembly.Compositor.png
        done
      - install -Dm644 flatpak/com.wonderassembly.Compositor.desktop /app/share/applications/com.wonderassembly.Compositor.desktop
      - install -Dm644 flatpak/com.wonderassembly.Compositor.metainfo.xml /app/share/metainfo/com.wonderassembly.Compositor.metainfo.xml
    sources:
      - type: dir
        path: .