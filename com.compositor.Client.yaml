  # ───────────────────────── Module 2: OpenCV (vendored, static, minimal) ─
  # pugixml: RawSpeed reads its camera list with it. Static, PIC.
  - name: pugixml
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_POSITION_INDEPENDENT_CODE=ON
      - -DBUILD_SHARED_LIBS=OFF
      - -DCMAKE_INSTALL_LIBDIR=lib
    cleanup:
      - '*'
    sources:
      - type: archive
        path: third_party/sources/pugixml-1.14.tar.gz
        sha256: 2f10e276870c64b1db6809050a75e11a897a8d7456c4be5c6b2e35a11168a015

  # RawSpeed (darktable's RAW decoder) for LibRaw's RawSpeed-v3 path: 2-2.5x faster unpacking of compressed CR2/NEF
  # and the other formats it lists. LibRaw supports exactly this commit, with the patches and C wrapper it ships in
  # RawSpeed3/ (01 is stored reversed). Same steps as scripts/build-rawspeed.sh.
  - name: rawspeed
    buildsystem: simple
    build-commands:
      - patch -p1 -R < libraw-src/RawSpeed3/patches/01.CameraMeta-extensibility.patch
      - for p in libraw-src/RawSpeed3/patches/0[2-5]*.patch; do patch -p1 --forward < "$p"; done
      - cmake -S . -B _build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_POSITION_INDEPENDENT_CODE=ON
        -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_PREFIX_PATH=/app -DBUILD_TESTING=OFF -DBUILD_TOOLS=OFF
        -DBUILD_BENCHMARKING=OFF -DBUILD_FUZZERS=OFF -DBUILD_DOCS=OFF -DWITH_OPENMP=OFF -DRAWSPEED_ENABLE_WERROR=OFF
        -DRAWSPEED_ENABLE_DEBUG_INFO=OFF -DUSE_XMLLINT=OFF -DBINARY_PACKAGE_BUILD=ON -DWITH_PUGIXML=ON -DWITH_JPEG=ON
        -DWITH_ZLIB=ON
      - cmake --build _build --target rawspeed
      - mkdir -p _capi /app/pugixml && cp /app/include/pugi*.hpp /app/pugixml/
      - sh libraw-src/RawSpeed3/rawspeed3_c_api/rsxml2c.sh < data/cameras.xml > _capi/cameras.cpp
      - for src in libraw-src/RawSpeed3/rawspeed3_c_api/rawspeed3_capi.cpp _capi/cameras.cpp; do g++ -std=c++17 -O3 -fPIC
        -DNDEBUG -I src/librawspeed -I src/external -I _build/src -I _build -I /app/include -c "$src"
        -o "_capi/$(basename "$src" .cpp).o"; done
      - ar rcs /app/lib/librawspeed3_capi.a _capi/rawspeed3_capi.o _capi/cameras.o
      - install -m644 _build/librawspeed.a /app/lib/
      - install -m644 libraw-src/RawSpeed3/rawspeed3_c_api/rawspeed3_capi.h /app/include/
      - rm -rf /app/pugixml
    sources:
      - type: archive
        path: third_party/sources/de70ef5fbc62cde91009c8cff7a206272abe631e.tar.gz
        sha256: 993d5e6498d838c10d49aafa193a8ec46307be2b7554a81d31cfc21f3c2726e8
      - type: archive
        path: third_party/sources/LibRaw-0.22.2.tar.gz
        sha256: de86b035655accff8d4010f1a221fdf50d353cb7b1422ba26f14a0db92612cfa
        dest: libraw-src

  # LibRaw: camera RAW decoding (host/RawDecoder.cpp). Static and PIC, linked into the app; OpenMP for the
  # multithreaded demosaic of very large files; JasPer and LCMS off (not needed); RawSpeed-v3 for faster unpacking
  # (COMPOSITOR_RAWSPEED=0 turns it off at run time). Same options as scripts/build-libraw.sh uses for the dev loop.
  - name: libraw
    buildsystem: autotools
    post-install:
      - touch /app/include/libraw/rawspeed3-enabled
    config-opts:
      - --enable-static
      - --disable-shared
      - --enable-openmp
      - --disable-examples
      - --disable-jasper
      - --disable-lcms
      - --enable-zlib
    build-options:
      cflags: -O3 -fPIC
      cxxflags: -O3 -fPIC
      cppflags: -DUSE_RAWSPEED3 -DUSE_RAWSPEED_BITS -I/app/include
    sources:
      - type: archive
        path: third_party/sources/LibRaw-0.22.2.tar.gz
        sha256: de86b035655accff8d4010f1a221fdf50d353cb7b1422ba26f14a0db92612cfa
      # Initialize the OpenMP wavelet allocation count before Noise Reduction uses it.
      - type: patch
        path: linux/patches/libraw-0.22.2-wavelet-size.patch

  # RAW Lens Correction for files without a profile of their own: lensfun's lens database (LGPL-3 library, CC-BY-SA 3.0
  # data) by camera and lens, static over the runtime's GLib (host/RawLensfun.h). Same options as
  # scripts/build-lensfun.sh. The database installs to /app/share/lensfun/version_1.
  - name: lensfun
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - -DCMAKE_POSITION_INDEPENDENT_CODE=ON
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DBUILD_STATIC=ON
      - -DBUILD_TESTS=OFF
      - -DBUILD_LENSTOOL=OFF
      - -DBUILD_DOC=OFF
      - -DINSTALL_HELPER_SCRIPTS=OFF
      - -DINSTALL_PYTHON_MODULE=OFF
      - -DBUILD_FOR_SSE=ON
      - -DBUILD_FOR_SSE2=ON
    post-install:
      - install -Dm644 -t /app/share/licenses/com.compositor.Client/lensfun docs/lgpl-3.0.txt docs/cc-by-sa-3.0.txt
    cleanup:
      - /lib/python*
    sources:
      - type: archive
        path: third_party/sources/lensfun-0.3.4.tar.gz
        sha256: dafb39c08ef24a0e2abd00d05d7341b1bf1f0c38bfcd5a4c69cf5f0ecb6db112

  # EXR import and export (compat ImageIO through host/QtImageIO.cpp, as Apple's ImageIO reads and writes it):
  # OpenEXR with its Imath and libdeflate, static, as scripts/build-openexr.sh builds them for the dev loop.
  - name: libdeflate
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_POSITION_INDEPENDENT_CODE=ON
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DLIBDEFLATE_BUILD_SHARED_LIB=OFF
      - -DLIBDEFLATE_BUILD_GZIP=OFF
    cleanup:
      - '*'
    sources:
      - type: archive
        path: third_party/sources/libdeflate-1.26.tar.gz
        sha256: bba03fffc5538576213675ce6968fcff6ce2e67d82e4d5febea2d05f9f13cf85

  - name: imath
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_POSITION_INDEPENDENT_CODE=ON
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DBUILD_SHARED_LIBS=OFF
      - -DBUILD_TESTING=OFF
      - -DPYTHON=OFF
    cleanup:
      - '*'
    sources:
      - type: archive
        path: third_party/sources/Imath-3.2.3.tar.gz
        sha256: e10c12b3f21f45bf08e09d4215d9c7691368d747beebd840de0b6fefed2df9f8

  - name: openexr
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_POSITION_INDEPENDENT_CODE=ON
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DBUILD_SHARED_LIBS=OFF
      - -DBUILD_TESTING=OFF
      - -DOPENEXR_BUILD_TOOLS=OFF
      - -DOPENEXR_BUILD_EXAMPLES=OFF
      - -DOPENEXR_INSTALL_EXAMPLES=OFF
      - -DOPENEXR_INSTALL_TOOLS=OFF
      - -DOPENEXR_BUILD_PYTHON=OFF
      - -DOPENEXR_INSTALL_DOCS=OFF
      - -DOPENEXR_FORCE_INTERNAL_DEFLATE=OFF
      - -DOPENEXR_FORCE_INTERNAL_IMATH=OFF
    cleanup:
      - '*'
    sources:
      - type: archive
        path: third_party/sources/openexr-3.5.1.tar.gz
        sha256: 61559d6d0657f228f8dd5e3165ed6b74437b95e81849ad41c6d3493c0c144c1d

  - name: opencv
    buildsystem: cmake-ninja
    builddir: true   # OpenCV refuses in-source builds
    config-opts:
      - -DBUILD_LIST=core,imgproc,dnn
      # G-API is excluded, but its initial probe otherwise tries to download ADE anyway.
      - -DWITH_ADE=OFF
      - -DBUILD_SHARED_LIBS=OFF
      - -DBUILD_TESTS=OFF
      - -DBUILD_EXAMPLES=OFF
      - -DBUILD_DOCS=OFF
      - -DBUILD_PERF_TESTS=OFF
      - -DBUILD_opencv_python2=OFF
      - -DBUILD_opencv_python3=OFF
      - -DBUILD_ZLIB=ON
      - -DBUILD_PNG=OFF   # PNG/JPEG 2000 are imgcodecs-only (not built); left on, OpenCVModules.cmake names missing libs
      - -DWITH_PNG=OFF
      - -DBUILD_JPEG=ON
      - -DBUILD_TIFF=OFF
      - -DBUILD_WEBP=OFF
      - -DBUILD_OPENJPEG=OFF
      - -DBUILD_OPENEXR=OFF
      - -DWITH_TIFF=OFF
      - -DWITH_WEBP=OFF
      - -DWITH_OPENJPEG=OFF
      - -DWITH_JASPER=OFF   # else exported to OpenCVModules.cmake without being built (no imgcodecs)
      - -DBUILD_JASPER=OFF
      - -DWITH_OPENEXR=OFF
      - -DWITH_V4L=OFF
      - -DWITH_GTK=OFF
      - -DWITH_GSTREAMER=OFF
      - -DWITH_FFMPEG=OFF
      - -DWITH_LAPACK=OFF
      - -DWITH_IPP=OFF
      - -DWITH_ITT=OFF   # Intel tracing: its static lib is not linked into the app
      - -DWITH_EIGEN=OFF
      - -DWITH_OPENCL=OFF
      - -DWITH_PROTOBUF=ON   # the dnn module reads ONNX models through its bundled protobuf
      - -DBUILD_PROTOBUF=ON
      - -DOPENCV_DNN_OPENCL=OFF
      - -DWITH_OPENVINO=OFF
      - -DWITH_FLATBUFFERS=OFF
      - -DCMAKE_INSTALL_PREFIX=/app
    sources:
       - type: archive
         path: third_party/sources/opencv-4.14.0.tar.gz
         sha256: ee8fb9b30eb60850431b4656447080e3737b56e45719c92b67f245950609f86e

  - name: poppler-data
    buildsystem: simple
    build-commands:
      - make install prefix=/app
      - install -Dm644 -t /app/share/licenses/com.compositor.Client/poppler-data COPYING COPYING.adobe COPYING.gpl2
    sources:
      - type: archive
        path: third_party/sources/poppler-data-0.4.12.tar.gz
        sha256: c835b640a40ce357e1b83666aabd95edffa24ddddd49b8daff63adb851cdab74

  - name: poppler
    buildsystem: cmake-ninja
    post-install:
      - install -Dm644 COPYING /app/share/licenses/com.compositor.Client/poppler/COPYING
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DENABLE_QT5=OFF
      - -DENABLE_QT6=ON
      - -DENABLE_CPP=OFF
      - -DENABLE_GLIB=OFF
      - -DENABLE_GOBJECT_INTROSPECTION=OFF
      - -DENABLE_UTILS=OFF
      - -DBUILD_MANUAL_TESTS=OFF
      - -DBUILD_QT6_TESTS=OFF
      - -DENABLE_BOOST=OFF
      - -DENABLE_NSS3=OFF
      - -DENABLE_GPGME=OFF
      - -DENABLE_LIBCURL=OFF
    sources:
      - type: archive
        path: third_party/sources/poppler-26.10.0.tar.xz
        sha256: 6792cb7c69205007ad87d2e936cecc5b3a31fac29ab54ffc3175fdb6b2a6ce35

  # ───────────────────────── Module 3: Compositor app ─────────────────────
  - name: compositor
    buildsystem: simple
    build-options:
      # Mount the Swift toolchain (org.freedesktop.Sdk.Extension.swift6 mounts
      # at /usr/lib/sdk/swift6 in the KDE SDK sandbox). append-path makes
      # `swift` available to every build-command (each runs in its own shell,
      # so a one-line `export PATH` would not persist across commands).
      append-path: /usr/lib/sdk/swift6/bin
    build-commands:
      # (a) Build the brush compute shader (Vulkan SPIR-V).
      - python3 scripts/build-brush-shader.py
      # (b) Build the Swift core as a static library with the runtime bundled.
      - swift build -c release --static-swift-stdlib
      # (c) Configure the C++ side against KDE-SDK Qt6 + vendored Skia/OpenCV
      #     in /app, and import the freshly built Swift static lib.
      - |
        cmake -S . -B build \
          -DCMAKE_PREFIX_PATH=/app \
          -DQt6_DIR=/usr/lib/x86_64-linux-gnu/cmake/Qt6 \
          -DOpenCV_DIR=/app/lib/cmake/opencv4 \
          -DCompositorCore_SWIFT_STATIC_LIB=$PWD/.build/release/libCompositorCore.a \
          -DCOMPOSITOR_REQUIRE_VENDORED_DEPS=ON \
          -DCOMPOSITOR_ENABLE_SKIA_GPU=ON
      # (d) Build + test. Host journey test needs offscreen Qt.
      - cmake --build build
      - QT_QPA_PLATFORM=offscreen ctest --test-dir build --output-on-failure
      # (e) Install Swift composition root. A C++ main cannot bootstrap the
      # Swift runtime + Foundation on the Freedesktop Swift SDK.
      - install -Dm755 .build/release/CompositorHostBootstrap /app/bin/compositor
      # Upstream 1.4.9 reads its Camera Raw tables from the main bundle, which on Linux is the binary's directory.
      - install -Dm644 Compositor/Resources/CameraRawTables.bin /app/bin/CameraRawTables.bin
      - install -Dm644 Compositor/Resources/CameraRawShadows.bin /app/bin/CameraRawShadows.bin
      # The compat layer dlopens these at run time from /app/lib: the Skia render device (every CGContext draws
      # through it) and Qt's image codecs + text engine. Without them the canvas stays empty.
      - install -Dm755 build/libCompositorSkiaBridge.so /app/lib/libCompositorSkiaBridge.so
      - install -Dm755 build/libCompositorQtImageIO.so /app/lib/libCompositorQtImageIO.so
      - install -Dm755 build/libCompositorPDFBackend.so /app/lib/libCompositorPDFBackend.so
      # (f) Install hicolor icons (sourced from the macOS AppIcon set).
      - |
        for s in 16 32 64 128 256 512; do
          install -Dm644 \
            Compositor/Assets.xcassets/AppIcon.appiconset/app-icon-${s}.png \
            /app/share/icons/hicolor/${s}x${s}/apps/com.compositor.Client.png
        done
      # (g) Install desktop entry + AppStream metainfo.
      # UI font: Inter (OFL), the stand-in for macOS's SF Pro (MACOS_UI_PARITY_RULES.md §4.2).
      - install -Dm644 -t /app/share/compositor/fonts third_party/fonts/inter/Inter-*.ttf
      - install -Dm644 third_party/fonts/inter/LICENSE.txt /app/share/compositor/fonts/Inter-LICENSE.txt
      # Subject segmentation (Select Subject / Remove Background): U²-Net-small, Apache-2.0 (third_party/models).
      - install -Dm644 third_party/models/u2netp.onnx /app/share/compositor/models/u2netp.onnx
      - install -Dm644 third_party/models/LICENSE-U2Net.txt /app/share/compositor/models/LICENSE-U2Net.txt
      # Default CMYK profile (View › CMYK, CMYK export): SWOP TR005 Coated from colord, CC0 (third_party/color).
      - install -Dm644 third_party/color/SWOP_TR005_coated_5.icc /app/share/compositor/color/SWOP_TR005_coated_5.icc
      - install -Dm644 third_party/color/README.md /app/share/compositor/color/README.md
      - install -Dm644 flatpak/com.compositor.Client.desktop /app/share/applications/com.compositor.Client.desktop
      - install -Dm644 flatpak/com.compositor.Client.metainfo.xml /app/share/metainfo/com.compositor.Client.metainfo.xml
      # MIME + thumbnailer: Finder Quick Look / Dock-Services twin for .comp packages.
      - install -Dm644 flatpak/com.compositor.Client.xml /app/share/mime/packages/com.compositor.Client.xml
      - install -Dm644 flatpak/com.compositor.Client.thumbnailer /app/share/thumbnailers/com.compositor.Client.thumbnailer
      - install -Dm755 build/compositor-thumbnailer /app/bin/compositor-thumbnailer
      - install -Dm644 LICENSE /app/share/licenses/com.compositor.Client/LICENSE
      - cp -r third_party/licenses/vendored /app/share/licenses/com.compositor.Client/
      - install -Dm644 third_party/sources/inventory.json /app/share/licenses/com.compositor.Client/vendored-sources.json
    sources:
       # Local source for development. Release builds replace this with the
       # exact repository commit used for the artifact.
       # Local dev source: build from the current checkout.
       - type: dir
         path: .
         skip:
           - .git
           - .build
           - .flatpak-builder
           - build
           - dist
           - build-host
           - build-swift
           - build-flatpak
           - build-flatpak-minimal
           - build-cmake
