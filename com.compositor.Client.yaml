# Flatpak manifest — Compositor Linux port (plan-converged baseline).
#
# Converges to the port plan's Stage 0 platform baseline:
#   - Runtime: Freedesktop 26.08 (branch, not point release).
#   - Qt 6.11.2: provided by org.kde.Sdk//6.11, which extends Freedesktop
#     26.08.1 and bundles Qt 6.11.2. The plan permits bundling "only the
#     needed Qt parts" over the Freedesktop platform; KDE SDK 6.11 is the
#     maintained Flatpak distribution of Qt 6.11.2 on Freedesktop 26.08.
#     Source-bundling Qt 6.11.2 is a separate spike (disk-heavy, deferred).
#   - Swift: org.freedesktop.Sdk.Extension.swift6//26.08 (Swift 6.3.3).
#     Plan §8.2 prefers Swift 6.4; only the static-SDK artifactbundle exists
#     for 6.4.0 (cross-compile SDK), not a regular Linux archive. The
#     extension is verified, installed, and matches the existing 408-test
#     suite. Swapping in Swift 6.4 later needs no source change.
#   - Skia: pinned canvaskit/0.42.0, GPU + Vulkan enabled (plan §8.4).
#   - OpenCV: 4.14.0 (plan §8.5), core+imgproc+dnn (dnn runs U²-Net-small for subject segmentation).
#
# Sandbox: portal-driven plus xdg-documents/xdg-download for .comp directory packages
# (document portal file grants cannot hold a folder package). No blanket home/host.
#   - --filesystem=xdg-documents:create / xdg-download:create
#   - --filesystem=xdg-config/user-dirs.dirs:ro (localized Documents/Downloads names)
#   - Other access via XDG FileChooser/Documents portals (plan §8.8).
#
# Build runs entirely inside the Flatpak SDK sandbox. Nothing links the build
# host's installed system libraries.

app-id: com.compositor.Client
branch: alpha
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk

# Swift toolchain. The extension branch tracks the Freedesktop base: KDE 6.11
# extends Freedesktop 26.08, so the matching extension branch is 26.08
# (provides Swift 6.3.3).
sdk-extensions:
  - org.freedesktop.Sdk.Extension.swift6

command: compositor

finish-args:
  - --share=ipc            # Qt platform plugin IPC
  - --socket=fallback-x11   # Qt windowing (X11 fallback)
  - --socket=wayland        # Qt windowing (Wayland, preferred)
  - --device=dri            # GPU: Vulkan + GL (plan §8.6, §8.7)
  # .comp projects are directory packages. The document portal only grants *files*,
  # which cannot be replaced with a folder. Allow the usual user save locations so
  # Save / Save As can create real .comp directories (still no blanket home/host).
  - --filesystem=xdg-documents:create
  - --filesystem=xdg-download:create
  # So Qt maps Documents/Downloads to localized names (e.g. Dokumenty / Pobrane).
  - --filesystem=xdg-config/user-dirs.dirs:ro
  # Plan §8.6: no --filesystem=home/host, no --share=network.
  # Other file access still routes through the XDG FileChooser/Documents portals.
  - --talk-name=org.freedesktop.portal.*   # FileChooser, Documents, Clipboard portals
  - --talk-name=com.canonical.AppMenu.Registrar   # the desktop's global menu, where there is one (menus as on the Mac)

# Strip static archives post-link (they are consumed at build time).
build-options:
  no-debuginfo: true

cleanup:
  - '*.a'

modules:
  # ───────────────────────── Module 1: Skia (vendored, static, GPU+Vulkan) ─
  - name: skia
    buildsystem: simple
    # Skia needs python3 + ninja from the SDK. Vulkan headers/loader come
    # from the Freedesktop 26.08 SDK (vulkan 1.4.357 pkgconfig).
    # All required Linux sources are checked in; this module builds without network access.
    build-commands:
      # Build the pinned GN source locally; dependency archives are already unpacked below.
      - cd gn-source && CXX=g++ python3 build/gen.py --no-last-commit-position && ninja -j${FLATPAK_BUILDER_N_JOBS:-6} -C out && cp out/gn ../bin/gn
      - |
        bin/gn gen out/Static --args='
            is_official_build=true
            skia_enable_ganesh=true
            skia_use_vulkan=true
            skia_use_gl=true
            skia_use_egl=true
            skia_use_system_icu=false
            skia_use_system_zlib=false
            skia_use_system_libpng=false
            skia_use_system_libjpeg_turbo=false
            skia_use_system_libwebp=false
            skia_use_system_harfbuzz=false
            skia_use_system_freetype2=false
            skia_enable_skshaper=true
        '
      - ninja -C out/Static
      # SkPathOps (CGPath booleans) is only built with PDF/XPS; archive it next to libskia.a.
      - ninja -C out/Static pathops
      - ar rcs out/Static/libskia_pathops.a out/Static/obj/src/pathops/*.o
      - mkdir -p /app/lib /app/include/skia
      - cp out/Static/libskia.a out/Static/libskia_pathops.a /app/lib/
      # Skia's headers include each other as "include/core/...": install the tree as is, so -I/app/include/skia
      # resolves them (a flattened copy leaves SkiaBridge.cpp without Skia, drawing nothing).
      - cp -r include /app/include/skia/
      # ... and the headers outside include/ they need: skcms (SkColorSpace.h -> modules/skcms/skcms.h -> src/*.h).
      - mkdir -p /app/include/skia/modules && cp -r modules/skcms /app/include/skia/modules/
        && find /app/include/skia/modules/skcms -type f ! -name '*.h' -delete
    sources:
       - type: archive
         path: third_party/sources/skia-canvaskit-0.42.0.tar.gz
         sha256: 3b574f9b0315d00b54c611ff6d827c29a1b65121ceed7278b451c20f0f8516a1

